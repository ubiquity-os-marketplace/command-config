name: "@ubiquity-os-marketplace/command-config"
description: "Edit UbiquityOS configuration files from plain-English instructions."

inputs:
  stateId:
    description: "State Id"
    required: true
  eventName:
    description: "Event Name"
    required: true
  eventPayload:
    description: "Event Payload"
    required: true
  settings:
    description: "Settings"
    required: true
  authToken:
    description: "Auth Token"
    required: true
  ref:
    description: "Ref"
    required: false
  signature:
    description: "Signature sent from the Kernel"
    required: true
  command:
    description: "Command"
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20.10.0"

    - name: Execute plugin
      shell: bash
      run: node dist/index.js
      env:
        PLUGIN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KERNEL_PUBLIC_KEY: ${{ secrets.KERNEL_PUBLIC_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'info' }}

