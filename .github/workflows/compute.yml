name: Compute

on:
  workflow_dispatch:
    inputs:
      stateId:
        description: "State Id"
      eventName:
        description: "Event Name"
      eventPayload:
        description: "Event Payload"
      settings:
        description: "Settings"
      authToken:
        description: "Auth Token"
      ubiquityKernelToken:
        description: "Kernel attestation token (optional)"
      kernelPublicKey:
        description: "Kernel public key PEM for signature verification (optional)"
        required: false
      ref:
        description: "Ref"
      signature:
        description: "The kernel signature"
      command:
        description: "Command from the Kernel"
        required: false

jobs:
  compute:
    runs-on: ubuntu-latest
    permissions: write-all
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'main' || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - name: ${{ github.event.repository.name }}
        uses: ./
        with:
          stateId: ${{ github.event.inputs.stateId }}
          eventName: ${{ github.event.inputs.eventName }}
          eventPayload: ${{ github.event.inputs.eventPayload }}
          settings: ${{ github.event.inputs.settings }}
          authToken: ${{ github.event.inputs.authToken }}
          ubiquityKernelToken: ${{ github.event.inputs.ubiquityKernelToken }}
          kernelPublicKey: ${{ github.event.inputs.kernelPublicKey }}
          ref: ${{ github.event.inputs.ref }}
          signature: ${{ github.event.inputs.signature }}
          command: ${{ github.event.inputs.command }}
        env:
          PLUGIN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_PUBLIC_KEY: ${{ (github.event.sender.type == 'Bot' && github.event.inputs.kernelPublicKey) || secrets.KERNEL_PUBLIC_KEY }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'info' }}
